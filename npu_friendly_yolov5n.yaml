# NPU-Friendly YOLOv5 object detection model

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.22, 960]

# NPU-friendly YOLOv5 backbone
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, NPUC3, [128]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, NPUC3, [256]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 9, NPUC3, [512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, NPUC3, [1024]]
  - [-1, 1, NPUSPPF, [1024, 5]] # 9

# NPU-friendly YOLOv5 head
head:
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, QConcat, [1]] # cat backbone P4
  - [-1, 3, NPUC3, [512]] # 13

  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, QConcat, [1]] # cat backbone P3
  - [-1, 3, NPUC3, [256]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, QConcat, [1]] # cat head P4
  - [-1, 3, NPUC3, [512]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, QConcat, [1]] # cat head P5
  - [-1, 3, NPUC3, [1024]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, QDetect, [nc]] # QDetect(P3, P4, P5)
