# Ultralytics YOLO dYs? AGPL-3.0 license
# YOLOv10 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 10 # number of classes
scales: # model compound scaling constants, i.e. 'model=fprt_yolov10.yaml' will call fprt_yolov10.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv10.0 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, FCM_3, [128]]
  - [-1, 1, Down, [256]]
  - [-1, 1, FCM_2, [256]]
  - [-1, 1, Down, [512]]
  - [-1, 1, FCM_1, [512]]
  - [-1, 1, Pzconv, [512]]
  - [-1, 1, FCM, [512]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 1, PSA, [512]]

# YOLOv10.0 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]

  - [-1, 1, Down, [256]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Down, [512]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [[16, 19, 22], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
